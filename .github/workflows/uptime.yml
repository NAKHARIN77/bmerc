# Checks the live site every 10 minutes from outside our servers. A failed run makes GitHub email the
# repository owner. A backup to UptimeRobot (docs/operations.md), not a replacement: GitHub may delay or
# skip scheduled runs when it is busy, and pauses them after 60 days without commits.
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site, API and database answer
        run: |
          set -u
          check() { # name url must-contain
            for try in 1 2 3; do
              body=$(curl -sS --max-time 30 "$2" || true)
              if printf '%s' "$body" | grep -q "$3"; then echo "OK   $1"; return 0; fi
              sleep 20
            done
            echo "DOWN $1 ($2) answered: ${body:0:200}"
            return 1
          }
          ok=0
          check "Home page (Vercel)" https://bmerc.vercel.app/ "BMERC" || ok=1
          check "API + database via Vercel" https://bmerc.vercel.app/api/v1/health '"db":"ok"' || ok=1
          check "API on Railway" https://bmerc-production.up.railway.app/api/v1/health '"status":"ok"' || ok=1
          exit $ok
