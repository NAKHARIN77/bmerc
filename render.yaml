# Render Blueprint: one web service (site + API in one container) in Singapore. The database is on Supabase.
# In Render: New → Blueprint → pick this repository. See docs/deploy-render.md.
services:
  - type: web
    name: bmerc
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      # The database owner login (Supabase session pooler, ending in ?sslmode=require). Set it in the
      # Render dashboard: Render's own free database expires after 30 days, so it is no longer used.
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Email: set these in the Render dashboard (never in this file).
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
