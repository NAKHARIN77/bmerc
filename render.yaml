# Render Blueprint: one web service (site + API in one container) and one PostgreSQL database, in Singapore.
# In Render: New → Blueprint → pick this repository. See docs/deploy-render.md.
services:
  - type: web
    name: bmerc
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: MIGRATE_DATABASE_URL
        fromDatabase:
          name: bmerc-db
          property: connectionString
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Email: set these in the Render dashboard (never in this file).
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: bmerc-db
    plan: free
    region: singapore
    databaseName: bmerc
    postgresMajorVersion: "16"
