# Local development database only. Production uses a managed PostgreSQL with daily backups.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bmerc
      POSTGRES_PASSWORD: bmerc_dev
      POSTGRES_DB: bmerc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmerc"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
